<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW Intelligence · Client Health</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@font-face{font-family:'Lato';src:url('assets/fonts/lato-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Lato';src:url('assets/fonts/lato-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Lato';src:url('assets/fonts/lato-black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato','Helvetica Neue',Arial,sans-serif;background:#f7f7f6;color:#3c3c3b;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
input,select,button,textarea{font-family:inherit;}

/* ── Nav ── */
nav{background:#fff;border-bottom:1px solid #e6e6e5;padding:0 24px;display:flex;align-items:center;position:sticky;top:0;z-index:100;height:48px}
.embed-mode .nav-back,.embed-mode .nav-brand,.embed-mode .nav-meta,.embed-mode .nav-sep{display:none!important}
.embed-mode nav{padding:0 20px;background:#fff;border-bottom:1px solid #e6e6e5}
.embed-mode .nav-tab{padding:0 14px;height:44px;display:flex;align-items:center;font-size:13px;}
.embed-mode main{padding:16px 20px 24px;}
.embed-mode body{background:#f7f7f6}
.nav-brand{font-size:14px;font-weight:700;margin-right:28px;white-space:nowrap;color:#3c3c3b;letter-spacing:-0.01em}
.nav-tabs{display:flex;height:100%;flex:1}
.nav-tab{padding:0 14px;font-size:13px;border-bottom:2px solid #288184;color:#3c3c3b;white-space:nowrap;display:flex;align-items:center;font-weight:600}
.nav-meta{font-size:11px;color:#9d9d9d;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav-back{font-size:12px;color:#6d6d6c;text-decoration:none;display:flex;align-items:center;gap:4px;padding:0;margin-right:16px}
.nav-back:hover{color:#3c3c3b}
.nav-sep{width:1px;height:20px;background:#e6e6e5;margin-right:16px;flex-shrink:0}
main{max-width:1320px;margin:0 auto;padding:24px}

/* ── KPI strip ── */
.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kpi{background:#fff;border:1px solid #e6e6e5;border-radius:10px;padding:14px 18px;min-width:150px;flex:1}
.kpi-label{font-size:10px;color:#9d9d9d;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi-value{font-size:26px;font-weight:600;line-height:1.2;color:#3c3c3b}
.kpi-value.teal{color:#288184}
.kpi-value.warn{color:#c62828}
.kpi-value.amber{color:#e65100}
.kpi-value.blue{color:#1565c0}
.kpi-sub{font-size:11px;margin-top:4px;color:#9d9d9d}

/* ── Card ── */
.card{background:#fff;border:1px solid #e6e6e5;border-radius:12px;padding:18px 20px;margin-bottom:16px}

/* ── Filters ── */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-label{font-size:11px;color:#9d9d9d;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:0 10px;border-radius:100px;border:1px solid #e6e6e5;background:#fff;font-size:12px;cursor:pointer;color:#6d6d6c;height:30px;user-select:none}
.pill:hover{border-color:#9d9d9d}
.pill.active{background:#288184;color:#fff;border-color:#288184}
select{padding:0 8px;border:1px solid #e6e6e5;border-radius:6px;font-size:12px;background:#fff;outline:none;cursor:pointer;color:#3c3c3b;height:30px}
input[type=search]{padding:0 10px;border:1px solid #e6e6e5;border-radius:6px;font-size:13px;outline:none;color:#3c3c3b;height:30px;width:200px}
input[type=search]:focus{border-color:#288184;outline:none}
.toggle-group{display:flex;border:1px solid #e6e6e5;border-radius:6px;overflow:hidden}
.toggle-btn{padding:5px 10px;font-size:12px;cursor:pointer;background:#fff;color:#6d6d6c;border:none;border-right:1px solid #e6e6e5}
.toggle-btn:last-child{border-right:none}
.toggle-btn.active{background:#3c3c3b;color:#fff}

/* ── Table ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid #e6e6e5;font-weight:600;font-size:10px;color:#9d9d9d;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:#fff}
th.sortable{cursor:pointer}
th.sortable:hover{color:#3c3c3b}
th.num{text-align:right}
td{padding:9px 10px;border-bottom:1px solid rgba(230,230,229,.55);vertical-align:top}
td.num{text-align:right;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}

/* ── Expandable rows ── */
tr.expandable{cursor:pointer}
tr.expandable:hover td{background:#fafaf8}
tr.expanded-row td{background:#f0fafb}
tr.expand-detail td{background:#f4f8fb;padding:10px 16px 14px;border-bottom:1px solid #d6e8eb}
tr.expand-detail.hidden{display:none}
tfoot td{font-size:11px;color:#9d9d9d;padding:6px 10px;border-top:1px solid #e6e6e5}

/* ── Badges ── */
.pg{background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.py{background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.pr{background:#ffebee;color:#c62828;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.pb{background:#e3f0fb;color:#1565c0;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.pn{background:#f5f5f5;color:#9d9d9d;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}

/* ── Health pills ── */
.hp{display:inline-flex;align-items:center;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;border:2px solid transparent;transition:opacity .15s}
.hp:hover{opacity:.8}
.hp.dim{opacity:.35;pointer-events:none}
.hp.sel{border-color:#3c3c3b}
.hp-od{background:#fdeee0;color:#c2600f}
.hp-ar{background:#fff3e0;color:#e65100}
.hp-tw{background:#e3f2fd;color:#1565c0}
.hp-ok{background:#e8f5e9;color:#2e7d32}

/* ── Loading / empty ── */
#loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:16px;color:#9d9d9d;font-size:13px}
.spinner{width:28px;height:28px;border:2px solid #e6e6e5;border-top-color:#288184;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:32px;color:#9d9d9d;font-size:13px}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-back"><i class="ti ti-arrow-left" aria-hidden="true"></i> Argus</a>
  <span class="nav-sep"></span>
  <div class="nav-brand"><i class="ti ti-chart-line" aria-hidden="true" style="margin-right:5px;color:#288184"></i>SW Intelligence</div>
  <div class="nav-tabs">
    <div class="nav-tab">Region Health</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0">
      <div class="toggle-group" id="curr-toggle">
        <div class="toggle-btn" data-curr="eur" onclick="setCurr('eur')">€ EUR</div>
        <div class="toggle-btn active" data-curr="gbp" onclick="setCurr('gbp')">£ GBP</div>
      </div>
      <span id="live-dot" style="display:none;font-size:10px;font-weight:700;letter-spacing:.06em;color:#2e7d32;white-space:nowrap">● LIVE</span>
      <span id="demo-dot" style="display:none;font-size:10px;font-weight:700;letter-spacing:.06em;color:#e65100;white-space:nowrap">● DEMO</span>
    </div>
  </div>
  <div class="nav-meta">ARR <strong id="arr-date">—</strong>&nbsp;·&nbsp;Fabric</div>
</nav>

<div id="loading"><div class="spinner"></div>Loading SW data…</div>

<main id="main-content" style="display:none">

<!-- ══ REGION HEALTH ══════════════════════════════════════════════════════════ -->
<section id="clients">

  <!-- Health status filter bar -->
  <div id="health-bar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;">
    <span class="filter-label" style="font-size:11px;color:#9d9d9d;font-weight:700">Renewal Health:</span>
    <span class="hp hp-od sel" id="hp-all" onclick="setHealth('all')" style="background:#f5f5f5;color:#6d6d6c">All Accounts</span>
    <span class="hp hp-od" id="hp-OVERDUE" onclick="setHealth('OVERDUE')">0 Overdue</span>
    <span class="hp hp-ar" id="hp-AT_RISK"  onclick="setHealth('AT_RISK')">0 At Risk</span>
    <span class="hp hp-tw" id="hp-TO_WATCH" onclick="setHealth('TO_WATCH')">0 To Watch</span>
    <span class="hp hp-ok" id="hp-HEALTHY"  onclick="setHealth('HEALTHY')">0 Healthy</span>
  </div>

  <!-- KPI strip -->
  <div class="kpi-row" id="ch-kpi-row"></div>

  <!-- Filters row 1 — search + group-by -->
  <div class="filter-bar">
    <div style="display:flex;flex:1;min-width:220px;max-width:380px;border:1.5px solid #e6e6e5;border-radius:8px;overflow:hidden;background:#fff;">
      <input type="text" id="cl-search" placeholder="Search account or parent…"
        onkeydown="if(event.key==='Enter')renderClients()"
        style="flex:1;padding:6px 12px;border:none;font-size:13px;font-family:inherit;outline:none;min-width:0;">
      <button onclick="renderClients()"
        style="padding:6px 14px;background:#288184;color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">Search</button>
    </div>
    <select id="cl-sw" onchange="renderClients()"><option value="ALL">All products</option></select>
    <span style="margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0">
      <span class="filter-label">Group by:</span>
      <div class="toggle-group" id="groupby-toggle">
        <div class="toggle-btn active" data-gb="energy"  onclick="setGroupBy(this,'energy')">Energy Market</div>
        <div class="toggle-btn"        data-gb="billing" onclick="setGroupBy(this,'billing')">Billing Region</div>
      </div>
    </span>
  </div>

  <!-- Filters row 2 — region hierarchy (energy market mode only) -->
  <div class="filter-bar" id="region-bar">
    <span class="filter-label">Region:</span>
    <div class="pill active" data-region="all" onclick="setRegion(this,'all')">All Markets</div>
  </div>

  <!-- Filters row 3 — sub-market pills (shown when EMEA/APAC selected in energy mode) -->
  <div class="filter-bar" id="mkt-bar" style="display:none"></div>

  <!-- Filters row 3 — signal pills -->
  <div class="filter-bar">
    <span class="filter-label">Signals:</span>
    <div class="pill active" id="fp-ALL"         onclick="setFP(this,'ALL')">All</div>
    <div class="pill"        id="fp-terminating" onclick="setFP(this,'terminating')">Termination</div>
    <div class="pill"        id="fp-upsell"      onclick="setFP(this,'upsell')">Cross-sell</div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;overflow-x:auto">
    <table id="client-table"></table>
  </div>

</section>

</main>

<script>
let DATA = null, CURR = 'gbp';
const DATA_CACHE = {}, EXPANDED = new Set();
let FP = 'ALL', SS = { col: 'arr_k', dir: -1 };
let MKT_COL = {};
let REGION = 'all', MKT = new Set(), GROUP_BY = 'energy';
let HEALTH = 'all';

const SW_COLORS = {
  Chronos: { bg:'#e3f0fb', fg:'#0c447c' },
  Amun:    { bg:'#e8f5e9', fg:'#2e7d32' },
  Origin:  { bg:'#fff3e0', fg:'#e65100' },
  Lumus:   { bg:'#e0f7f7', fg:'#00695c' },
  Solaris: { bg:'#fce4ec', fg:'#880e4f' },
};

function currSym() { return CURR === 'gbp' ? '£' : '€'; }

function setCurr(c) {
  CURR = c;
  document.querySelectorAll('#curr-toggle .toggle-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.curr === c);
  });
  if (DATA_CACHE[c]) {
    DATA = DATA_CACHE[c];
    renderKPIs();
    renderClients();
  } else {
    loadData(c);
  }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
function dash() { return "<span style='color:#d0d0d0'>—</span>"; }
function arrFmt(k) { return currSym() + Math.round(k).toLocaleString() + 'k'; }

function mktDot(m) {
  var c = MKT_COL[m] || '#288184';
  return "<span style='display:inline-flex;align-items:center;gap:5px'>"
    + "<span style='width:8px;height:8px;border-radius:50%;background:"+c+";flex-shrink:0;margin-top:1px'></span>"
    + "<span style='font-weight:600;color:"+c+"'>"+esc(m)+"</span>"
    + "</span>";
}

function swChip(s) {
  var c = SW_COLORS[s] || { bg:'#f5f5f5', fg:'#6d6d6c' };
  return "<span style='display:inline-flex;align-items:center;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;background:"+c.bg+";color:"+c.fg+"'>"+esc(s)+"</span>";
}

function setFP(el, mode) {
  FP = mode;
  document.querySelectorAll('#clients .pill[id^="fp-"]').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  renderClients();
}

function setRegion(el, r) {
  REGION = r; MKT = new Set(); HEALTH = 'all';
  document.querySelectorAll('#region-bar .pill').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  populateMktPills();
  renderKPIs();
  renderClients();
}

function setMkt(el, m) {
  if (!m) {
    MKT = new Set();
    document.querySelectorAll('#mkt-bar .pill').forEach(function(p) { p.classList.remove('active'); });
    el.classList.add('active');
  } else {
    if (MKT.has(m)) { MKT.delete(m); el.classList.remove('active'); }
    else             { MKT.add(m);    el.classList.add('active'); }
    var allPill = document.querySelector('#mkt-bar .pill[data-mkt=""]');
    if (allPill) allPill.classList.toggle('active', MKT.size === 0);
  }
  renderKPIs();
  renderClients();
}

function populateMktPills() {
  var bar = document.getElementById('mkt-bar');
  if (!DATA || REGION === 'all') { bar.style.display = 'none'; return; }
  var mkts, label;
  if (GROUP_BY === 'billing') {
    var bSet = new Set();
    DATA.clients.forEach(function(r) {
      if ((r.region || '').toLowerCase() === REGION && r.billing_market) bSet.add(r.billing_market);
    });
    mkts = [...bSet].sort();
    label = 'Territory:';
  } else {
    var rm = DATA.region_map || {};
    mkts = Object.keys(rm).filter(function(m) { return (rm[m] || '').toLowerCase() === REGION; }).sort();
    label = 'Market:';
  }
  if (!mkts.length) { bar.style.display = 'none'; return; }
  var html = '<span class="filter-label">' + label + '</span>'
    + '<div class="pill active" data-mkt="" onclick="setMkt(this,\'\')">All ' + REGION.toUpperCase() + '</div>'
    + mkts.map(function(m) {
        return '<div class="pill" data-mkt="' + esc(m) + '" onclick="setMkt(this,\'' + esc(m).replace(/'/g,'\\&#39;') + '\')">' + esc(m) + '</div>';
      }).join('');
  bar.innerHTML = html;
  bar.style.display = 'flex';
}

function populateRegionPills() {
  var bar = document.getElementById('region-bar');
  if (!DATA) return;
  var rm = DATA.region_map || {};
  var regions = [...new Set(Object.values(rm).filter(Boolean))].sort();
  var html = '<span class="filter-label">Region:</span>'
    + '<div class="pill active" data-region="all" onclick="setRegion(this,\'all\')">All Markets</div>'
    + regions.map(function(r) {
        var key = r.toLowerCase();
        return '<div class="pill" data-region="' + key + '" onclick="setRegion(this,\'' + key + '\')">' + r + '</div>';
      }).join('');
  bar.innerHTML = html;
}

function openClientHealth(acct) {
  try {
    localStorage.setItem('argusHealthAccount', acct);
    localStorage.setItem('argusInitView', 'health');
  } catch(e) {}
  window.open('/', '_blank');
}

function setGroupBy(el, gb) {
  GROUP_BY = gb;
  REGION = 'all'; MKT = new Set(); HEALTH = 'all';
  document.querySelectorAll('#groupby-toggle .toggle-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  var mb = document.getElementById('mkt-bar');
  if (mb) mb.style.display = 'none';
  // Reset region pills
  document.querySelectorAll('#region-bar .pill').forEach(function(p) {
    p.classList.toggle('active', p.getAttribute('data-region') === 'all');
  });
  renderKPIs();
  renderClients();
}

function clientHealthBucket(client) {
  var TODAY = new Date(); TODAY.setHours(0,0,0,0);
  var minDays = Infinity;
  (client.sw_lines || []).forEach(function(l) {
    if (!l.end_date) return;
    var d = new Date(l.end_date);
    var days = Math.round((d - TODAY) / (1000*60*60*24));
    if (days < minDays) minDays = days;
  });
  if (minDays === Infinity) return client.flag_terminating ? 'AT_RISK' : 'HEALTHY';
  if (minDays < 0)  return 'OVERDUE';
  if (minDays < 30) return 'AT_RISK';
  if (minDays < 90) return 'TO_WATCH';
  return 'HEALTHY';
}

function setHealth(key) {
  HEALTH = key;
  renderHealthBar();
  renderKPIs();
  renderClients();
}

function renderHealthBar() {
  if (!DATA) return;
  // Apply region/market filter but NOT health filter (bar shows full distribution in current scope)
  var clients = DATA.clients.slice();
  if (REGION !== 'all') clients = clients.filter(function(r) { return (r.region || '').toLowerCase() === REGION; });
  if (GROUP_BY === 'energy' && MKT.size > 0) clients = clients.filter(function(r) { return MKT.has(r.market); });
  if (GROUP_BY === 'billing') clients = toBillingClients(clients);
  if (GROUP_BY === 'billing' && MKT.size > 0) clients = clients.filter(function(r) { return MKT.has(r.market); });
  var ALL_CLIENTS = clients;
  var fmtA = function(v) { return v >= 1000 ? currSym()+(v/1000).toFixed(1)+'m' : currSym()+Math.round(v)+'k'; };
  var DEFS = [
    { key:'OVERDUE',  id:'hp-OVERDUE',  lbl:'Overdue'  },
    { key:'AT_RISK',  id:'hp-AT_RISK',  lbl:'At Risk'  },
    { key:'TO_WATCH', id:'hp-TO_WATCH', lbl:'To Watch' },
    { key:'HEALTHY',  id:'hp-HEALTHY',  lbl:'Healthy'  },
  ];
  // Update All button
  var allBtn = document.getElementById('hp-all');
  if (allBtn) {
    allBtn.classList.toggle('sel', HEALTH === 'all');
    allBtn.style.background = HEALTH === 'all' ? '#3c3c3b' : '#f5f5f5';
    allBtn.style.color      = HEALTH === 'all' ? '#fff'    : '#6d6d6c';
  }
  DEFS.forEach(function(d) {
    var btn = document.getElementById(d.id);
    if (!btn) return;
    var bucket = ALL_CLIENTS.filter(function(c) { return clientHealthBucket(c) === d.key; });
    var cnt = bucket.length;
    var arr = bucket.reduce(function(s, c) { return s + c.arr_k; }, 0);
    btn.textContent = cnt > 0 ? cnt + ' ' + d.lbl + ' · ' + fmtA(arr) : '0 ' + d.lbl;
    btn.classList.toggle('dim', cnt === 0);
    btn.classList.toggle('sel', HEALTH === d.key);
  });
}

// Re-aggregate energy-market clients into billing-region clients
function toBillingClients(rows) {
  var byKey = {};
  rows.forEach(function(r) {
    var key = r.account + '||' + (r.billing_market || '');
    if (!byKey[key]) byKey[key] = {
      account:        r.account,
      parent:         r.parent,
      market:         r.billing_market || r.market,
      region:         r.region,
      billing_market: r.billing_market,
      sw_lines: [],
      arr_k: 0,
      flag_terminating: false,
      flag_renewal:     false,
      flag_upsell:      false,
    };
    byKey[key].sw_lines = byKey[key].sw_lines.concat(r.sw_lines || []);
    byKey[key].arr_k += r.arr_k || 0;
    byKey[key].flag_terminating = byKey[key].flag_terminating || r.flag_terminating;
    byKey[key].flag_renewal     = byKey[key].flag_renewal     || r.flag_renewal;
  });
  return Object.values(byKey).map(function(r) {
    r.arr_k    = Math.round(r.arr_k * 10) / 10;
    r.products = [...new Set((r.sw_lines || []).map(function(l) { return l.sw; }))];
    // Recompute cross-sell from merged distinct products — per-market flags are misleading in billing mode
    r.flag_upsell = r.products.length === 1 && r.arr_k > 20;
    return r;
  }).sort(function(a, b) { return b.arr_k - a.arr_k; });
}

// ── KPI strip ──────────────────────────────────────────────────────────────
function renderKPIs() {
  if (!DATA) return;
  var fc = filteredClients();
  var totalArr   = fc.reduce(function(s, c) { return s + c.arr_k; }, 0);
  var uniqueAccts = new Set(fc.map(function(c) { return c.account; })).size;
  var tipSubCount = 0, tipArr = 0;
  fc.filter(function(c) { return c.flag_terminating; }).forEach(function(c) {
    tipArr += c.arr_k;
    (c.sw_lines || []).forEach(function(l) { if (l.terminating) tipSubCount += (l.tip_count || 1); });
  });
  var xsell = fc.filter(function(c) { return c.flag_upsell; }).length;

  document.getElementById('ch-kpi-row').innerHTML =
    kpi('SW Clients', uniqueAccts, '', 'unique accounts active', '')
  + kpi('SW ARR', currSym() + Math.round(totalArr).toLocaleString() + 'k', 'teal', 'active subscriptions', '')
  + kpi('Terminations', tipSubCount, 'warn',
        tipSubCount > 0 ? currSym() + Math.round(tipArr) + 'k ARR at risk' : 'none in progress',
        tipSubCount > 0 ? 'color:#c62828' : '')
  + kpi('Cross-sell', xsell, 'blue', 'single product &gt;' + currSym() + '20k', '');
}

function kpi(label, val, cls, sub, subStyle) {
  return "<div class='kpi'>"
    + "<div class='kpi-label'>"+label+"</div>"
    + "<div class='kpi-value"+(cls?' '+cls:'')+"'>"+val+"</div>"
    + "<div class='kpi-sub'"+(subStyle?" style='"+subStyle+"'":"")+">"+sub+"</div>"
    + "</div>";
}

// ── Region Health table ────────────────────────────────────────────────────
function filteredClients() {
  if (!DATA) return [];
  var search = (document.getElementById('cl-search') || {}).value || '';
  search = search.toLowerCase();
  var sw = (document.getElementById('cl-sw') || {}).value || 'ALL';
  var rows = DATA.clients.slice();

  // Region filter — applied before billing re-aggregation (both modes use r.region)
  if (REGION !== 'all') rows = rows.filter(function(r) { return (r.region || '').toLowerCase() === REGION; });

  // Energy market sub-filter (energy mode only)
  if (GROUP_BY === 'energy' && MKT.size > 0) rows = rows.filter(function(r) { return MKT.has(r.market); });

  // Re-aggregate into billing-region view if needed
  if (GROUP_BY === 'billing') rows = toBillingClients(rows);

  // Billing market sub-filter (billing mode — after aggregation, market = billing_market)
  if (GROUP_BY === 'billing' && MKT.size > 0) rows = rows.filter(function(r) { return MKT.has(r.market); });

  // Account search, product, signal filters
  if (search) rows = rows.filter(function(r) {
    return r.account.toLowerCase().indexOf(search) >= 0
        || (r.parent && r.parent.toLowerCase().indexOf(search) >= 0);
  });
  if (sw !== 'ALL') rows = rows.filter(function(r) { return (r.products || []).indexOf(sw) >= 0; });
  if (FP === 'terminating') rows = rows.filter(function(r) { return r.flag_terminating; });
  if (FP === 'upsell') rows = rows.filter(function(r) { return r.flag_upsell; });
  if (HEALTH !== 'all') rows = rows.filter(function(r) { return clientHealthBucket(r) === HEALTH; });
  return rows;
}

function renderClients() {
  if (!DATA) return;
  renderHealthBar();
  var rows = filteredClients();
  // Group by account, sort by max ARR desc
  var ag = {}, am = {};
  rows.forEach(function(r) { if (!ag[r.account]) ag[r.account] = []; ag[r.account].push(r); });
  Object.keys(ag).forEach(function(a) {
    am[a] = Math.max.apply(null, ag[a].map(function(r) { return r.arr_k || 0; }));
  });
  var sortedAccts = Object.keys(ag).sort(function(a, b) { return SS.dir * (am[a] - am[b]); });

  function si(c) { return SS.col === c ? (SS.dir === -1 ? ' ↓' : ' ↑') : ''; }

  var html = "<thead><tr>"
    + "<th class='sortable' data-col='account' style='min-width:180px'>Account"+si('account')+"</th>"
    + "<th style='min-width:90px'>"+(GROUP_BY==='energy'?'Energy Market':'Billing Region')+"</th>"
    + "<th style='min-width:230px'>Products &amp; ARR</th>"
    + "<th class='sortable num' data-col='arr_k' style='min-width:90px'>Total ARR"+si('arr_k')+"</th>"
    + "<th style='min-width:150px'>Signals</th>"
    + "<th style='min-width:100px'>Next renewal</th>"
    + "<th style='width:100px'></th>"
    + "</tr></thead><tbody>";

  var totalRows = 0;
  sortedAccts.forEach(function(acct) {
    var prevAcct = null;
    ag[acct].forEach(function(r) {
      totalRows++;
      var key    = r.account + '||' + r.market;
      var ekey   = esc(key);
      var isExp  = EXPANDED.has(key);

      // Account cell — suppress repeat if same parent account spans markets
      var acctCell;
      if (prevAcct !== r.account) {
        acctCell = "<td style='vertical-align:top'>"
          + "<div style='font-weight:600'>"+esc(r.account)+"</div>"
          + (r.parent ? "<div style='font-size:11px;color:#9d9d9d;margin-top:1px'>"+esc(r.parent)+"</div>" : "")
          + "</td>";
      } else {
        acctCell = "<td style='color:transparent;user-select:none;font-size:10px;vertical-align:top'>"+esc(r.account)+"</td>";
      }
      prevAcct = r.account;

      // Products column: chip + sub-count pill + ARR
      var prodLines = (r.sw_lines || []).map(function(l) {
        var cnt = l.sub_count || 1;
        var cntPill = "<span style='font-size:10px;font-weight:700;color:#288184;"
          + "background:#e8f4f4;border-radius:10px;padding:1px 7px;white-space:nowrap'>"
          + cnt + " sub" + (cnt !== 1 ? 's' : '') + "</span>";
        return "<div style='display:flex;align-items:center;gap:5px;margin-bottom:3px'>"
          + swChip(l.sw)
          + cntPill
          + "<span style='font-size:12px;color:#6d6d6c;font-weight:600'>"
          + currSym() + l.arr_k.toFixed(0) + "k</span>"
          + (l.terminating ? "<span style='font-size:10px;color:#c62828;font-weight:700'>●</span>" : "")
          + "</div>";
      }).join('');

      // Signals column — Section 1: renewal timeline, Section 2: termination pill
      var prodRenew = {};
      (r.sw_lines || []).forEach(function(l) {
        if (!l.renewal_badge) return;
        if (!prodRenew[l.sw]) prodRenew[l.sw] = { renewing: 0, total: 0, badge: l.renewal_badge };
        prodRenew[l.sw].renewing += l.renew_count || 1;
        if (l.renewal_badge === '3M') prodRenew[l.sw].badge = '3M';
      });
      (r.sw_lines || []).forEach(function(l) {
        if (prodRenew[l.sw]) prodRenew[l.sw].total = Math.max(prodRenew[l.sw].total || 0, l.sub_count || 1);
      });

      var renewHtml = Object.keys(prodRenew).sort().map(function(sw) {
        var d   = prodRenew[sw];
        var cls = d.badge === '3M' ? 'py' : 'pg';
        return "<div style='display:flex;align-items:center;gap:4px;margin-bottom:2px'>"
          + "<span class='" + cls + "' style='padding:1px 6px;font-size:10px'>" + d.badge + "</span>"
          + "<span style='font-size:11px;font-weight:600;color:#3c3c3b'>" + esc(sw) + "</span>"
          + "<span style='font-size:10px;color:#9d9d9d'>" + d.renewing + "/" + d.total + " subs</span>"
          + "</div>";
      }).join('');

      var termHtml = '';
      if (r.flag_terminating) {
        var tSws = (r.sw_lines || []).filter(function(l) { return l.terminating; }).map(function(l) { return l.sw; });
        termHtml = "<div style='margin-top:" + (renewHtml ? '5px' : '0') + "'>"
          + "<div style='display:flex;align-items:center;gap:4px;flex-wrap:wrap'>"
          + "<span class='pr' style='padding:1px 6px;font-size:10px'>⚠ Terminating</span>"
          + tSws.map(function(s) {
              return "<span style='font-size:10px;font-weight:700;color:#c62828'>" + esc(s) + "</span>";
            }).join("<span style='color:#e0a0a0;font-size:10px'> · </span>")
          + "</div>"
          + "</div>";
      }

      var xsellHtml = r.flag_upsell
        ? "<div style='margin-top:" + (renewHtml || termHtml ? '4px' : '0') + "'>"
          + "<span class='pb' style='padding:1px 6px;font-size:10px'>↑ Cross-sell</span></div>"
        : '';

      var sigsCell = (renewHtml || termHtml || xsellHtml)
        ? "<div>" + renewHtml + termHtml + xsellHtml + "</div>"
        : dash();

      // Nearest end date
      var dates = (r.sw_lines || []).filter(function(l) { return l.end_date; })
                                    .map(function(l) { return l.end_date; }).sort();
      var rnCell = dates.length
        ? "<span style='font-size:12px;color:#6d6d6c'>"+esc(dates[0])+"</span>"
        : dash();

      // Main row
      html += "<tr class='expandable"+(isExp ? " expanded-row" : "")+"' data-ekey='"+ekey+"'>"
        + acctCell
        + "<td style='vertical-align:top;padding-top:10px'>"+mktDot(r.market)+"</td>"
        + "<td style='vertical-align:top'>"+prodLines+"</td>"
        + "<td class='num' style='font-weight:700;vertical-align:top;padding-top:10px'>"
        +   currSym()+r.arr_k.toFixed(0)+"k"
        + "</td>"
        + "<td style='vertical-align:top'>"+sigsCell+"</td>"
        + "<td style='vertical-align:top;padding-top:10px'>"+rnCell+"</td>"
        + "<td style='vertical-align:top;padding-top:7px'>"
        +   "<button class='ch-btn' data-acct='"+esc(r.account)+"' "
        +     "style='font-size:11px;font-weight:700;color:#288184;cursor:pointer;padding:4px 10px;"
        +     "border:1px solid #288184;border-radius:5px;background:#fff;white-space:nowrap'>"
        +     "Client Health →"
        +   "</button>"
        + "</td>"
        + "</tr>";

      // Expand detail row
      var detailRows = (r.sw_lines || []).map(function(l) {
        var rb = l.renewal_badge === '3M' ? "<span class='py'>3M</span>"
               : l.renewal_badge === '6M' ? "<span class='pg'>6M</span>"
               : dash();
        var status = l.terminating
          ? "<span class='pr'>Terminating</span>"
          : "<span style='font-size:12px;color:#2e7d32;font-weight:600'>Active</span>";
        var mktCell = GROUP_BY === 'billing' && l.energy_market
          ? "<td style='padding:5px 14px;border:none;font-size:11px;color:#9d9d9d;white-space:nowrap'>"+esc(l.energy_market)+"</td>"
          : '';
        return "<tr style='border-bottom:1px solid rgba(214,232,235,.6)'>"
          + "<td style='padding:5px 14px 5px 0;border:none'>"+swChip(l.sw)+"</td>"
          + mktCell
          + "<td style='padding:5px 14px;border:none;text-align:right;font-weight:700;white-space:nowrap'>"+currSym()+l.arr_k.toFixed(0)+"k</td>"
          + "<td style='padding:5px 14px;border:none;font-size:12px;color:#6d6d6c;white-space:nowrap'>"+(l.end_date ? esc(l.end_date) : dash())+"</td>"
          + "<td style='padding:5px 14px;border:none'>"+rb+"</td>"
          + "<td style='padding:5px 14px;border:none'>"+status+"</td>"
          + "</tr>";
      }).join('');

      html += "<tr class='expand-detail"+(isExp ? "" : " hidden")+"'>"
        + "<td colspan='7'>"
        + "<div style='font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px'>Subscription detail — click row to collapse</div>"
        + "<table style='width:auto'>"
        + "<thead><tr>"
        + "<th style='padding:3px 14px 5px 0;font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #d6e8eb;border-radius:0;background:transparent'>Product</th>"
        + (GROUP_BY === 'billing' ? "<th style='padding:3px 14px 5px;font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #d6e8eb;background:transparent'>Energy Market</th>" : '')
        + "<th style='padding:3px 14px 5px;font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #d6e8eb;text-align:right;background:transparent'>ARR</th>"
        + "<th style='padding:3px 14px 5px;font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #d6e8eb;background:transparent'>End date</th>"
        + "<th style='padding:3px 14px 5px;font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #d6e8eb;background:transparent'>Renewal</th>"
        + "<th style='padding:3px 14px 5px;font-size:10px;color:#9d9d9d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #d6e8eb;background:transparent'>Status</th>"
        + "</tr></thead>"
        + "<tbody>"+detailRows+"</tbody>"
        + "</table>"
        + "</td></tr>";
    });
  });

  var uniqueAcctCount = new Set(rows.map(function(r) { return r.account; })).size;
  html += "</tbody><tfoot><tr><td colspan='7'>"
    + totalRows + " subscription lines · " + uniqueAcctCount + " accounts"
    + "</td></tr></tfoot>";

  document.getElementById('client-table').innerHTML = html;

  // Sortable column click handlers (re-attach after innerHTML update)
  document.querySelectorAll('#client-table th.sortable').forEach(function(th) {
    th.addEventListener('click', function(e) {
      e.stopPropagation();
      var col = th.getAttribute('data-col');
      if (SS.col === col) SS.dir *= -1; else { SS.col = col; SS.dir = -1; }
      renderClients();
    });
  });
}

// ── Expand / collapse + Client Health button (event delegation on the table) ──
document.getElementById('client-table').addEventListener('click', function(e) {
  var chBtn = e.target.closest('.ch-btn');
  if (chBtn) { e.stopPropagation(); openClientHealth(chBtn.getAttribute('data-acct')); return; }
  if (e.target.closest('th')) return;
  var tr = e.target.closest('tr.expandable');
  if (!tr) return;
  var key = tr.getAttribute('data-ekey');
  if (!key) return;
  if (EXPANDED.has(key)) EXPANDED.delete(key);
  else EXPANDED.add(key);
  renderClients();
});

// ── Populate product dropdown ─────────────────────────────────────────────
function populateSelects(regions, swNames) {
  var sel = document.getElementById('cl-sw');
  if (sel) {
    while (sel.options.length > 1) sel.remove(1);
    swNames.forEach(function(s) {
      var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o);
    });
  }
}

// ── Load data from API ────────────────────────────────────────────────────
async function loadData(currency) {
  const isMock = new URLSearchParams(location.search).has('mock');
  const curr   = currency || 'gbp';
  const url    = '/api/sw-intelligence?currency=' + curr;
  const isInitial = !currency;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    DATA = await resp.json();
    DATA_CACHE[curr] = DATA;
    if (DATA.mkt_col) MKT_COL = DATA.mkt_col;
    document.getElementById('arr-date').textContent = DATA.arr_as_of || '—';
    var swNames = [...new Set((DATA.arr_vs_target || []).map(function(r) { return r.sw; }))].sort();
    if (DATA.regions && DATA.regions.length) populateSelects(DATA.regions, swNames);
    populateRegionPills();
    if (isInitial) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById(isMock ? 'demo-dot' : 'live-dot').style.display = '';
    }
    renderKPIs();
    renderClients();
  } catch (e) {
    if (isInitial) {
      document.getElementById('loading').innerHTML =
        '<p style="color:#c62828;font-size:13px">Failed to load SW data: ' + e.message + '</p>';
    }
  }
}

if (new URLSearchParams(location.search).get('embed') === '1') {
  document.documentElement.classList.add('embed-mode');
}

loadData();
